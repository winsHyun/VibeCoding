<!DOCTYPE html>
<!-- 작성일시: 2026-10-30 11:07 -->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>쇼핑 리스트</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>쇼핑 리스트</h1>
      <p id="summary" class="summary"></p>
    </header>

    <form id="add-form" class="add-form" autocomplete="off">
      <input id="item-input" type="text" placeholder="살 물건을 입력하세요" maxlength="100" required>
      <button type="submit">추가</button>
    </form>

    <ul id="item-list" class="item-list"></ul>
    <p id="empty-message" class="empty-message">아직 추가된 아이템이 없습니다.</p>

    <footer class="app-footer">
      <button id="clear-checked" type="button" class="link-button">체크된 항목 삭제</button>
    </footer>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
